<style>
#ft-page,#ft-page *{box-sizing:border-box;margin:0;padding:0}
#ft-page{--bg:#07060d;--card1:#15121f;--card2:#0b0a12;--border:rgba(168,85,247,.22);--primary:#a855f7;--cyan:#22d3ee;--muted:#9a95ad;--sec:#1a1626;--secfg:#e6e1f5;
position:relative;display:flex;min-height:100vh;width:100%;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);padding:40px 16px;cursor:pointer;font-family:'Figtree',system-ui,-apple-system,sans-serif;color:#fff;text-align:center;-webkit-font-smoothing:antialiased}
#ft-page .ft-blob{pointer-events:none;position:absolute;border-radius:9999px;filter:blur(40px);animation:ftBlob 8s ease-in-out infinite}
#ft-page .ft-b1{left:-96px;top:-96px;width:320px;height:320px;background:radial-gradient(circle,rgba(168,85,247,.55),rgba(168,85,247,0) 70%)}
#ft-page .ft-b2{right:-80px;bottom:-128px;width:384px;height:384px;background:radial-gradient(circle,rgba(34,211,238,.4),rgba(34,211,238,0) 70%);animation-delay:-4s}
@keyframes ftBlob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.08)}66%{transform:translate(-20px,20px) scale(.95)}}
#ft-page .ft-card{position:relative;width:100%;max-width:448px;border-radius:2.5rem;border:1px solid var(--border);background:linear-gradient(160deg,var(--card1),var(--card2));padding:48px 24px 40px;box-shadow:0 0 0 1px rgba(168,85,247,.08),0 20px 60px -10px rgba(168,85,247,.35),0 0 80px -20px rgba(34,211,238,.25);animation:ftIn .7s ease both}
@keyframes ftIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#ft-page .ft-logo-o{margin:0 auto;display:flex;width:160px;height:160px;align-items:center;justify-content:center;border-radius:9999px;border:1px solid rgba(168,85,247,.12)}
#ft-page .ft-logo{position:relative;width:128px;height:128px;border-radius:9999px;box-shadow:0 0 40px rgba(168,85,247,.55),0 0 80px rgba(34,211,238,.2)}
#ft-page .ft-ring{position:absolute;inset:0;border-radius:9999px;background:conic-gradient(from 0deg,var(--primary),var(--cyan),#ec4899,var(--primary));animation:ftSpin 6s linear infinite}
@keyframes ftSpin{to{transform:rotate(360deg)}}
#ft-page .ft-logo img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:9999px;object-fit:cover;display:block}
#ft-page .ft-badge{margin-top:32px;display:inline-flex;align-items:center;gap:8px;border-radius:9999px;border:1px solid var(--border);background:var(--sec);padding:6px 16px;font-size:12px;font-weight:600;letter-spacing:.025em;color:var(--secfg)}
#ft-page .ft-dot{width:6px;height:6px;border-radius:9999px;background:var(--primary)}
#ft-page h1{margin-top:20px;font-family:'Outfit',sans-serif;font-size:36px;line-height:1.1;font-weight:800;letter-spacing:-.025em;background:linear-gradient(135deg,#fff 20%,#d8b4fe 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(min-width:640px){#ft-page h1{font-size:48px}}
#ft-page .ft-sub{margin-top:12px;color:var(--muted);font-size:16px}
#ft-page .ft-grid{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;font-weight:500;color:var(--secfg)}
#ft-page .ft-tile{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:16px;border:1px solid var(--border);background:rgba(26,22,38,.6);padding:12px 8px}
#ft-page .ft-tile svg{width:16px;height:16px;color:var(--primary)}
#ft-page .ft-btn{position:relative;margin-top:28px;display:flex;width:100%;align-items:center;justify-content:center;gap:12px;overflow:hidden;border-radius:16px;border:1px solid rgba(168,85,247,.6);background:linear-gradient(135deg,#9333ea,#7c3aed 50%,#06b6d4);padding:16px 24px;font-size:18px;font-weight:600;color:#fff;text-decoration:none;box-shadow:0 10px 30px -5px rgba(147,51,234,.6);transition:transform .15s;animation:ftPulse 2s ease-out infinite}
#ft-page .ft-btn:hover{transform:scale(1.02)}#ft-page .ft-btn:active{transform:scale(.98)}
@keyframes ftPulse{0%{box-shadow:0 10px 30px -5px rgba(147,51,234,.6),0 0 0 0 rgba(168,85,247,.55)}70%{box-shadow:0 10px 30px -5px rgba(147,51,234,.6),0 0 0 14px rgba(168,85,247,0)}100%{box-shadow:0 10px 30px -5px rgba(147,51,234,.6),0 0 0 0 rgba(168,85,247,0)}}
#ft-page .ft-shine{position:absolute;top:0;bottom:0;left:0;width:33%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:ftShine 2.5s ease-in-out infinite}
@keyframes ftShine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(380%) skewX(-20deg)}}
#ft-page .ft-btn svg{width:20px;height:20px;position:relative}
#ft-page .ft-note{margin-top:16px;font-size:14px;color:var(--muted)}
#ft-page .ft-foot{margin-top:32px;font-size:12px;color:var(--muted)}
#ft-page .ft-foot a{color:inherit;text-decoration:underline}
@media(prefers-reduced-motion:reduce){#ft-page *{animation:none!important}}
</style>
